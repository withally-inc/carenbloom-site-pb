  <title>Care &amp; Bloom | Consumer health brands</title>
  <meta name="description" content="Care &amp; Bloom builds consumer health brands. Hello Nancy and Biird: 1,000,000+ customers in under 36 months, profitably." />
  <link rel="canonical" href="%VITE_SITE_URL%/" />
  <meta name="theme-color" content="#F4F6F8" />
  <script>
    // theme before first paint (src/lib/theme.ts): the stored choice, else system dark means violet
    (function () {
      var t = null
      try { t = localStorage.getItem('cb-theme') } catch (e) {}
      if (t !== 'violet' && t !== 'light') {
        try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'violet' : 'light' } catch (e) { t = 'light' }
      }
      document.documentElement.setAttribute('data-theme', t)
      if (t === 'violet') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#160F2E')
      // the hero still (LCP) of the active theme only: both hero pictures are lazy (sections/hero.html)
      try {
        var k = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'hero-end' : 'hero-start'
        var s = t === 'violet' ? '-violet' : ''
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.setAttribute('fetchpriority', 'high')
        l.setAttribute('imagesrcset', '/img/' + k + s + '-480.webp 480w, /img/' + k + s + '-896.webp 896w')
        l.setAttribute('imagesizes', '(min-width: 768px) 40vw, 64vw')
        document.head.appendChild(l)
      } catch (e) {}
    })()
  </script>

  <script>
    // before first paint: motion gating, whether the bloom intro plays (once per
    // session), and the content fade for a same-origin navigation (never back/forward)
    (function () {
      var h = document.documentElement
      h.classList.add('js')
      var rm = false
      try {
        rm = matchMedia('(prefers-reduced-motion: reduce)').matches
        var seen = sessionStorage.getItem('cb-intro') === '1'
        h.classList.add(seen || rm ? 'no-preload' : 'intro')
        // the hero rose paints under the curtain, so the dissolving curtain reveals it (LCP)
        if (!seen && !rm) h.classList.add('cb-curtain')
      } catch (e) {
        h.classList.add('no-preload')
      }
      try {
        var nav = performance.getEntriesByType('navigation')[0]
        var same = document.referrer && new URL(document.referrer).origin === location.origin
        if (same && !rm && (!nav || nav.type === 'navigate')) h.classList.add('pgt-fade')
      } catch (e) {}
    })()
  </script>
