  <meta name="theme-color" content="#F4F6F8" />
  <script>
    // theme before first paint (src/lib/theme.ts): the stored choice, else system dark means violet
    (function () {
      var t = null
      try { t = localStorage.getItem('cb-theme') } catch (e) {}
      if (t !== 'violet' && t !== 'light') {
        try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'violet' : 'light' } catch (e) { t = 'light' }
      }
      document.documentElement.setAttribute('data-theme', t)
      if (t === 'violet') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#160F2E')
    })()
  </script>

  <script>
    // before first paint: motion gating, whether the bloom intro plays (once per
    // session), and the content fade for a same-origin navigation (never back/forward)
    (function () {
      var h = document.documentElement
      h.classList.add('js')
      var rm = false
      try {
        rm = matchMedia('(prefers-reduced-motion: reduce)').matches
        var seen = sessionStorage.getItem('cb-intro') === '1'
        h.classList.add(seen || rm ? 'no-preload' : 'intro')
      } catch (e) {
        h.classList.add('no-preload')
      }
      try {
        var nav = performance.getEntriesByType('navigation')[0]
        var same = document.referrer && new URL(document.referrer).origin === location.origin
        if (same && !rm && (!nav || nav.type === 'navigate')) h.classList.add('pgt-fade')
      } catch (e) {}
    })()
  </script>
